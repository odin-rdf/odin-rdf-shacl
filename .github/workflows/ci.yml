# `make test` runs the suite and `make check` vets every package, so this
# workflow's only real job is arranging the checkout the way the Makefile's
# collections expect.
#
# Two checkouts, not one. This repo reaches its dependencies through
# -collection:rdf=../odin-rdf-parser and -collection:record=../odin-rdf-record,
# both relative to this repo, so all three go into sibling directories under
# the workspace rather than the default layout. The `rdf:` collection is
# needed even where this project only names the record: record's own sources
# import `rdf:`, and a collection resolves in the importing compilation.
#
# The platform matrix is the family's. It used to be load-bearing for
# linkage — `shacl/kvstore` linked the LMDB archives odin-rdf-store vendored
# per platform — and with the SHACL-I-0004 port there is no native code in
# any link. What the three runners prove now is that the record store
# compiles everywhere this repository is built (its posix `File_Ops` is
# `#+build linux, darwin`; Windows compiles the package without it) and that
# the suites, which open every store over the platform-free memory seam, run
# identically on each.
name: CI

# Documentation-only commits do not run this workflow. More than half the
# commits in a working session here touch only `.metis/` and `docs/`, and each
# one was costing a three-platform matrix to prove that prose still compiles.
#
# **A denylist, not an allowlist, and the asymmetry is the whole argument.** The
# tempting spelling is `paths: [shacl/**, tests/**, bench/**, ...]` — run only
# for these. That fails toward *no CI*: add a source directory the list does not
# name and it is silently unverified, which is the same shape of hazard as a
# skip list, and this repository's whole convention is to assert rather than
# trust. A denylist fails the other way — add a documentation directory nobody
# adds here and you get a pointless run until the list catches up. Wasteful,
# visible, harmless.
#
# `.github/**` is deliberately absent from the list: a change to CI must run CI.
# `workflow_dispatch` carries no filter either, so any commit can be run by hand
# from the Actions tab regardless.
#
# One thing to know before adding branch protection: a workflow skipped by a
# path filter reports no status at all, so if this ever becomes a *required*
# check, documentation-only pull requests will wait forever for a run that will
# not happen. It does not bite today — this repository commits to main directly.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Windows used to run one `Term_ID` width where the others ran two,
        # to halve a job that was paying LMDB's link time twelve times over.
        # The width matrix left with odin-rdf-store (SHACL-T-0033) — record's
        # widths are fixed by design — so every runner now runs the same
        # `make test`, once.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: odin-rdf-shacl

      # Both are pinned to released tags rather than tracking main, so an
      # upstream commit cannot turn this repository's CI red without a
      # deliberate bump here (SHACL-T-0020). A red build then means this
      # repository broke, which is the only way to tell a local regression from
      # an upstream one.
      #
      # odin-rdf-store was the third checkout here from SHACL-T-0020 until
      # SHACL-T-0033, pinned last at `v0.6.0` over a floor that rose three
      # times (`v0.1.1` for the per-platform LMDB archives, `v0.2.0` for
      # `compile_turtle`'s post-memstore signature, `v0.3.0` for transactions,
      # `v0.5.0` for as-of reads — SHACL-T-0020/-T-0028/-T-0029/-T-0030). The
      # SHACL-I-0004 port replaced it with odin-rdf-record; the checkout and
      # the `store:` collection are gone, not retained beside the record.
      #
      # To bump either: change the ref, run `make test` and `make check` locally
      # against the new checkout, and commit them together — a collection is
      # resolved in the *importing* compilation, so the record's sources are
      # built against whichever parser this file names, and moving one without
      # the other is how two versions of the data model end up in one binary.
      # odin-rdf-parser `v0.1.1` (2026-08-20): one scanner fix, RDF-T-0025 —
      # an unterminated long string now reports the opener's line and
      # column instead of the EOF line and a negative column. Nothing this
      # repository reads changed; the bump is the family's walk-the-consumers
      # rule on release, and the bug was found by a sibling's W3C sweep.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-parser
          ref: v0.1.1
          path: odin-rdf-parser

      # **odin-rdf-record `v0.4.0` is the pin and a floor**, the fourth; the
      # first three were cut in one day. `v0.1.0` was the first floor (SHACL-T-0031, the SHACL-I-0004
      # port): the record's first tag, holding everything this repository
      # consumes — `store_open`/`apply`, the snapshot read API,
      # `record/ingest`, `Mem_FS`/`mem_file_ops`, the `Validator` hook.
      # `v0.2.0` raised it for one reason this suite found (SHACL-T-0033):
      # `ingest` emits a document's *set* of statements (RECORD-T-0019),
      # where `v0.1.0` emitted its list and `apply` refused the second assert
      # of a repeated statement — `core/complex/shacl-shacl`'s shapes graph
      # repeats two, and below `v0.2.0` that entry cannot load. `v0.3.0`
      # raised it again for a type: the record's ids are the distinct
      # `Term_ID`, `Fact_ID` and `Epoch` (RECORD-T-0020), and this engine
      # holds `record.Term_ID` natively — `Session.graph`, `Focus_Node.id`,
      # the `Bindings` arrays — so it does not compile below `v0.3.0`.
      # `v0.4.0` raised it a fourth time, and for once not for anything this
      # suite found: it is the release RDF 1.2's triple terms landed in
      # (RECORD-I-0004), cut for the odin-rdf-sparql port. **This engine does
      # not need triple terms**; it needs the two things their arrival changed
      # about the API it already used (SHACL-T-0038). `record.Term_Kind` gained
      # a fourth member, `.Triple`, and `node_kind_of` switches on that enum
      # exhaustively — a compile error, and the right one: it is the single
      # site in the engine that had to be told a new term kind exists.
      # `snapshot_term` can now return a term it *owns* rather than lends, so
      # `snapshot_term_destroy` is paired with every decode, which also closes
      # the split-IRI leak this contract had admitted since the port and had no
      # verb to fix. Two things worth knowing at this seam:
      #
      #   - **Windows**: the record has no Windows `File_Ops` — its posix file
      #     is `#+build linux, darwin`, so the package compiles on Windows
      #     without it, and the suites open stores over `mem_file_ops`
      #     (`Mem_FS`), which is platform-free. Nothing here touches a real
      #     record directory.
      #   - **python3**: the record's *own* `make test` needs it (the
      #     cross-implementation verifier); a consumer compiling the library
      #     does not, so this job installs nothing.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-record
          ref: v0.4.0
          path: odin-rdf-record

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Odin version
        run: odin version

      - name: Vet every package
        working-directory: odin-rdf-shacl
        run: make check

      - name: Test
        working-directory: odin-rdf-shacl
        run: make test
