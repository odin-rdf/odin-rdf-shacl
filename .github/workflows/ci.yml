# `make test` runs the whole matrix (both Term_ID widths) and `make check`
# vets every package and asserts the core-purity property, so this workflow's
# only real job is arranging the checkout the way the Makefile's collections
# expect.
#
# Two checkouts, not one. This repo reaches its dependencies through
# -collection:rdf=../odin-rdf-parser and -collection:store=../odin-rdf-store,
# both relative to this repo, so all three go into sibling directories under
# the workspace rather than the default layout. Both collections are needed
# even though SHACL Core only names the store: the store's own sources import
# `rdf:`, and a collection resolves in the importing compilation.
#
# The platform matrix is odin-rdf-store's, and it is load-bearing here rather
# than inherited decoration. `shacl/kvstore` links the LMDB archives vendored
# in odin-rdf-store (STORE-A-0004), which exist for darwin arm64/amd64, linux
# arm64/amd64, and windows amd64 — anything else falls back to a system
# library that will not be there. The three runners below are all covered
# platforms, and `shacl/kvstore`'s linkage test is what proves the archive
# actually resolves and runs on each rather than merely compiling.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: odin-rdf-shacl

      # Both are pinned rather than tracking main, so an upstream commit cannot
      # turn this repository's CI red without a deliberate bump here
      # (SHACL-T-0020). A red build then means this repository broke, which is
      # the only way to tell a local regression from an upstream one.
      #
      # **They are pinned differently, and the asymmetry is the finding.**
      # odin-rdf-parser is on its released tag. odin-rdf-store is on a commit,
      # because `v0.1.0` of the store predates STORE-A-0004 and vendors exactly
      # one LMDB archive — `liblmdb_darwin_arm64.a`. `shacl/kvstore` links those
      # archives, so a tag pin would build here and on macOS and fail to link on
      # the ubuntu and windows runners below. The five-platform vendoring exists
      # only after the tag.
      #
      # This is not a code incompatibility: the whole suite passes against
      # `v0.1.0` of both, on a platform whose archive that tag happens to carry.
      # It is a packaging gap, and the fix is upstream — **odin-rdf-store cutting
      # a release that includes the vendored archives.** When it does, this
      # becomes `ref: v0.2.0` and the asymmetry goes away.
      #
      # The store ref is the **full** 40-character SHA, deliberately: a short SHA
      # is not resolvable by `actions/checkout` under its default
      # `fetch-depth: 1`, which fetches by ref rather than cloning history. It
      # fails on every runner with a bare "git failed with exit code 1".
      #
      # To bump either: change the ref, run `make test` and `make check` locally
      # against the new checkout, and commit them together — a collection is
      # resolved in the *importing* compilation, so the store's sources are built
      # against whichever parser this file names, and moving one without the
      # other is how two versions of the data model end up in one binary.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-parser
          ref: v0.1.0
          path: odin-rdf-parser

      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-store
          ref: f896b7bbb435d3d2122a57485fb0192887863834
          path: odin-rdf-store

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Odin version
        run: odin version

      # `check` ends by building tests/purity and inspecting it for LMDB
      # symbols. On Windows `nm` is absent and the symbol check skips itself
      # with a message — the property is platform-independent, so proving it
      # on the runners that can is enough.
      - name: Vet every package and check core purity
        working-directory: odin-rdf-shacl
        run: make check

      - name: Test at both Term_ID widths
        working-directory: odin-rdf-shacl
        run: make test
